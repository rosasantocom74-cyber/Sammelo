<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="description" content="Sammelo: tu música, tu biblioteca, en cualquier dispositivo.">

<script>try{var p=JSON.parse(localStorage.getItem('pf')||'{}'),t=p.theme||'dark';if(t==='auto')t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';document.documentElement.dataset.theme=t;if(p.accent)document.documentElement.style.setProperty('--g',p.accent)}catch(e){}</script>
<title>Sammelo</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bg0:#000;--bg:#121212;--p:#1a1a1a;--p2:#2a2a2a;--p3:#3a3a3a;--fld:#2a2a2a;--t:#fff;--m:#b3b3b3;--g:#9b8cff;--gt:var(--g);--hv:#ffffff1a;--hv2:#ffffff14;--hv3:#ffffff26;--bar:#ffffff22;--line:#727272;--inv:#fff;--invt:#000;--dlg:#282828;--scrim:#000a;--np1:#35308f;--hdg:#35308f99;--pl:84px;--nv:58px;--nvt:calc(var(--nv) + var(--sab));color-scheme:dark}
[data-theme=light]{--bg0:#e6e6ee;--bg:#ffffff;--p:#f3f3f8;--p2:#e9e9f1;--p3:#dcdce8;--fld:#ececf4;--t:#14141c;--m:#5d5d70;--gt:color-mix(in srgb,var(--g) 50%,#000);--hv:#00000012;--hv2:#0000000d;--hv3:#0000001c;--bar:#00000022;--line:#b3b3c4;--inv:#14141c;--invt:#fff;--dlg:#fff;--scrim:#0006;--np1:#d4ccff;--hdg:#9b8cff55;color-scheme:light}
[data-theme=light] .dh{background:linear-gradient(color-mix(in srgb,var(--c,#9b8cff) 35%,#fff),transparent)}
[data-theme=light] .st,[data-theme=light] .card2,[data-theme=light] .sess{box-shadow:0 1px 0 #00000012}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg0);color:var(--t);font:400 14px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:2px}
svg{width:22px;height:22px;fill:currentColor;flex:none}
input:not([type=range]){width:100%;background:var(--fld);color:var(--t);border:1px solid transparent;border-radius:999px;padding:12px 18px;font:inherit}
input:not([type=range]):focus{border-color:var(--t);outline:0}
input[type=range]{-webkit-appearance:none;appearance:none;background:none;width:100%;height:18px;margin:0;cursor:pointer;--p:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--gt) var(--p),var(--bar) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border-radius:50%;background:var(--t);box-shadow:0 2px 6px #0006;opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb{opacity:1;transform:none}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--bar)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--gt)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:var(--t);opacity:0}
input[type=range]:hover::-moz-range-thumb,input[type=range]:focus-visible::-moz-range-thumb{opacity:1}
input[type=range]:focus-visible{outline:0}
@media(hover:none){input[type=range]::-webkit-slider-thumb{opacity:1;transform:none}input[type=range]::-moz-range-thumb{opacity:1}}
.mut{color:var(--m)}
.auth{max-width:380px;margin:8vh auto;padding:calc(24px + var(--sat)) 20px 24px;display:grid;gap:14px}
.auth h1{font-size:28px;font-weight:800;text-align:center}
.auth p{text-align:center}
.auth label{display:grid;gap:6px;font-weight:600}
.btn{background:var(--g);color:#14102a;font-weight:800;border-radius:999px;padding:13px 24px;text-align:center;display:block;text-decoration:none}
.btn:hover{transform:scale(1.03)}
.btn.ghost{background:none;color:var(--t);border:1px solid var(--line)}
.lnk{color:var(--m);text-decoration:underline;font-size:13px}
.msg{min-height:20px;font-size:13px;color:#ff7d8a;text-align:center}.msg.ok{color:var(--gt)}
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:1fr var(--pl);height:100vh;height:100dvh;gap:8px;padding:8px}
.sort{background:var(--fld);color:var(--t);border:0;border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer}
.sort:focus-visible{outline:2px solid var(--g)}
.rm{color:var(--m)}.rm:hover{color:#ff7d8a}
.np-seek{display:flex;gap:8px;align-items:center;color:var(--m);font-size:12px;margin:0 0 16px}
.np-ctl{display:flex;gap:10px;align-items:center;justify-content:center;margin:0 0 18px}
.np-ctl .play{width:48px;height:48px}
@media(min-width:801px){.np-ctl{display:none}}
nav{grid-row:1;background:var(--bg);border-radius:10px;padding:14px 8px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 14px 18px;font-size:20px;font-weight:800}
.brand i{width:34px;height:34px;border-radius:50%;background:var(--g);color:#14102a;display:grid;place-items:center}
nav button{display:flex;align-items:center;gap:16px;padding:12px 14px;border-radius:8px;color:var(--m);font-weight:600;font-size:15px;text-align:left}
nav button:hover{color:var(--t)}
nav button[aria-current=page]{color:var(--t);background:var(--p2)}
nav .sp{flex:1}
main{background:var(--bg);border-radius:10px;overflow:auto;min-width:0}
.hd{padding:calc(28px + var(--sat)) 24px 12px;background:linear-gradient(var(--hdg),transparent)}
.hd h2{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}
.hd input{max-width:420px}
.bar{display:flex;gap:10px;align-items:center;padding:14px 24px;flex-wrap:wrap}
.big{width:52px;height:52px;border-radius:50%;background:var(--g);color:#14102a;display:grid;place-items:center}
.big:hover{transform:scale(1.06)}
.songs{list-style:none;padding:0 12px 24px}
.songs li{display:grid;grid-template-columns:36px 1fr auto 38px 38px 46px;gap:10px;align-items:center;padding:6px 12px;border-radius:6px;cursor:pointer}
.songs li:hover{background:var(--hv)}
.songs li.on .t b{color:var(--gt)}
.n{color:var(--m);text-align:center;font-variant-numeric:tabular-nums}
li.on .n{color:var(--gt)}
.tt{display:flex;gap:12px;align-items:center;min-width:0}
.tt img,.cov{width:44px;height:44px;border-radius:4px;object-fit:cover;background:var(--p2);flex:none}
.t{min-width:0}.t b,.t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t span{color:var(--m);font-size:13px}
.d{color:var(--m);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.ib{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:var(--m)}
.ib:hover{color:var(--t)}.ib[aria-pressed=true]{color:var(--gt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:8px 24px 24px}
.card{background:var(--p);border-radius:8px;padding:14px;text-align:left;width:100%}
.card:hover{background:var(--p2)}
.card .cv{aspect-ratio:1;border-radius:6px;background:linear-gradient(135deg,#4b3fd1,#9b8cff);display:grid;place-items:center;margin-bottom:12px}
.card .cv svg{width:44px;height:44px}
.card b{display:block}
.pad{padding:0 24px 24px;display:grid;gap:10px;max-width:520px}
.mt{padding:40px 24px}
.player{grid-column:1/-1;background:var(--bg0);display:grid;grid-template-columns:1fr 2fr 1fr;align-items:center;gap:16px;padding:0 12px}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.ctr{display:grid;gap:6px;justify-items:center}
.btns{display:flex;align-items:center;gap:8px}
.play{width:36px;height:36px;border-radius:50%;background:var(--inv);color:var(--invt);display:grid;place-items:center}
.play:hover{transform:scale(1.07)}
.seek{display:flex;gap:8px;align-items:center;width:100%;max-width:560px;color:var(--m);font-size:12px}
.vol{display:flex;justify-content:flex-end;align-items:center;gap:8px}.vol input{max-width:110px}
#rp[data-m="1"],#sh[aria-pressed=true],#rp[data-m="2"]{color:var(--gt)}
dialog{margin:auto;background:var(--dlg);color:var(--t);border:0;border-radius:12px;padding:20px;width:min(92vw,360px);max-height:86vh;overflow:auto}
dialog::backdrop{background:var(--scrim)}dialog h3{margin-bottom:12px}
.row{display:block;width:100%;text-align:left;padding:12px;border-radius:8px}.row:hover{background:var(--hv)}
#toast{position:fixed;left:50%;bottom:calc(var(--pl) + 24px);transform:translateX(-50%);background:var(--inv);color:var(--invt);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
.logo{width:120px;height:120px;border-radius:26px;margin:0 auto;display:block}
.brand img{width:34px;height:34px;border-radius:8px}
.now{cursor:pointer}
#np{position:fixed;z-index:3;inset:8px 8px calc(var(--pl) + 16px) 276px;background:linear-gradient(var(--np1),var(--bg) 65%);border-radius:10px;overflow:auto;padding:20px 28px;display:grid;grid-template-columns:minmax(240px,1fr) 1.2fr;gap:32px;align-content:start}
#np[hidden]{display:none}
.disc{width:min(100%,360px);aspect-ratio:1;border-radius:50%;margin:16px auto;background:repeating-radial-gradient(circle,#0c0c0c 0 2px,#1d1d1d 3px 4px);box-shadow:0 14px 40px #000a;display:grid;place-items:center;animation:spin 7s linear infinite;animation-play-state:paused}
.disc.spin{animation-play-state:running}
.disc img{width:38%;aspect-ratio:1;border-radius:50%;object-fit:cover;background:var(--p2);box-shadow:0 0 0 6px #0009}
@keyframes spin{to{transform:rotate(360deg)}}
#np h2{font-size:30px;font-weight:800;letter-spacing:-.5px}
.info{display:grid;gap:2px;margin:12px 0 20px;color:var(--m)}
.lyr{white-space:pre-wrap;font-size:18px;line-height:1.7;font-weight:600;margin-bottom:12px;max-height:50vh;overflow:auto;position:relative;scroll-behavior:smooth}
.ll{white-space:normal;font-size:24px;font-weight:800;line-height:1.3;margin:0 0 14px;opacity:.38;cursor:pointer;transition:opacity .25s,transform .25s;transform-origin:left}
.ll:hover{opacity:.7}.ll.on{opacity:1;transform:scale(1.04)}
.adj[hidden]{display:none}
.adj{display:flex;gap:8px;align-items:center;margin-bottom:14px;color:var(--m);font-size:12px}
.adj button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--t);font-size:12px}
.lyr.empty{color:var(--m);font-weight:400;font-size:14px}
#np textarea{width:100%;min-height:260px;background:var(--fld);color:var(--t);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;margin-bottom:10px}

.row-h{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:18px 24px 6px}
.sec-h h3{font-size:22px;font-weight:800;letter-spacing:-.3px}
.sec-h button{color:var(--m);font-weight:700;font-size:13px}.sec-h button:hover{color:var(--t);text-decoration:underline}
.tile{flex:none;width:172px;text-align:left;padding:12px;border-radius:10px;scroll-snap-align:start;transition:background .2s;cursor:pointer;min-width:0}
.tile:hover,.tile:focus-visible{background:var(--p2)}
.tile>div{position:relative}
.art{position:relative;aspect-ratio:1;width:100%;border-radius:8px;overflow:hidden;background:var(--p2);display:grid;box-shadow:0 8px 24px #0006}
.art.round{border-radius:50%}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art.mos{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.art .ini{display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff;text-shadow:0 2px 12px #0006}
.art .ini svg{width:38%;height:38%;opacity:.9}
.tile b{display:block;margin-top:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .s{color:var(--m);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:50%;background:var(--g);color:#14102a;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;box-shadow:0 8px 16px #0006}
.pl:hover{transform:scale(1.06)}
.tile:hover .pl,.tile:focus-within .pl,.qk:hover .pl,.qk:focus-within .pl{opacity:1;transform:none}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:0 24px 8px}
.qk{position:relative;display:flex;align-items:center;gap:12px;background:var(--hv2);border-radius:6px;overflow:hidden;height:58px;cursor:pointer;transition:background .2s;min-width:0}
.qk:hover{background:var(--hv3)}
.qk .art{width:58px;height:58px;border-radius:0;box-shadow:none;flex:none}
.qk .art .ini{font-size:20px}
.qk b{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:56px}
.qk .pl{right:10px;bottom:auto;top:11px;width:36px;height:36px}
.qk .pl svg{width:18px;height:18px}
.grid .tile{width:auto}
.chips{display:flex;gap:8px;padding:4px 24px 8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;background:var(--fld);font-weight:600;display:inline-flex;gap:8px;align-items:center}.chip svg{width:16px;height:16px}
.chip:hover{background:var(--p3)}.chip[aria-pressed=true]{background:var(--inv);color:var(--invt)}
.dh{display:flex;gap:24px;align-items:flex-end;padding:calc(32px + var(--sat)) 24px 12px;background:linear-gradient(var(--c,#35308f),transparent)}
.dh .art{width:200px;flex:none;box-shadow:0 14px 40px #0008}
.dh small{text-transform:uppercase;font-weight:800;font-size:11px;letter-spacing:.1em}
.dh h2{font-size:clamp(28px,5vw,56px);font-weight:800;letter-spacing:-1px;line-height:1.05;margin:6px 0 10px}
@media(hover:none){.pl{opacity:1;transform:none;width:44px;height:44px}.pl svg{width:20px;height:20px}}
@media(max-width:800px){.row-h{padding:4px 8px 12px}.sec-h{padding:16px 16px 6px}.quick{padding:0 16px 8px;grid-template-columns:1fr 1fr;gap:8px}.qk{height:52px}.qk .art{width:52px;height:52px}.qk b{font-size:13px;padding-right:44px}.qk .pl{display:none}.chips{padding:4px 16px 8px}.tile{width:142px;padding:8px}.dh{flex-direction:column;align-items:flex-start;gap:16px;padding:20px 16px 8px}.dh .art{width:150px}.grid{padding:8px 12px 24px;gap:8px}}

.pf-ban{height:calc(190px + var(--sat));background:radial-gradient(circle at 18% 25%,#ffffff40,transparent 42%),radial-gradient(circle at 85% 80%,#00000066,transparent 50%),linear-gradient(135deg,var(--g),#1a1550)}
.pf-head{display:flex;gap:24px;align-items:flex-end;padding:0 24px;margin-top:-68px;position:relative}
.pf-av{position:relative;width:148px;height:148px;border-radius:50%;border:6px solid var(--bg);overflow:hidden;flex:none;display:grid;place-items:center;font-size:48px;font-weight:800;color:#fff;box-shadow:0 10px 30px #0008}
.pf-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pf-av.sm{width:96px;height:96px;font-size:32px;border-width:3px;box-shadow:none}
.pf-id{min-width:0;padding-bottom:10px}
.pf-id h2{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.8px;line-height:1.1;overflow-wrap:anywhere}
.pf-id .at{color:var(--m)}
.pf-bio{padding:14px 24px 0;max-width:640px;white-space:pre-wrap}
.pf-badges{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px 0}
.badge{display:inline-flex;gap:6px;align-items:center;background:var(--hv2);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;color:var(--m)}
.badge svg{width:14px;height:14px}.badge.a{background:var(--g);color:#14102a}
.stats4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px 24px 6px}
.st{background:var(--p);border-radius:12px;padding:14px 16px}
.st b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px}.st span{color:var(--m);font-size:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;padding:8px 24px 24px}
.card2{background:var(--p);border-radius:14px;padding:18px;min-width:0}
.card2.wide{grid-column:1/-1}
.card2 h4,.form h4{font-size:16px;font-weight:800;margin-bottom:4px}
.big2{font-size:34px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.wk{display:flex;gap:8px;height:120px;margin-top:14px}
.wc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.wc i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--g);min-height:4px;opacity:.9}
.wc span{font-size:11px;color:var(--m)}
.mini{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:6px;border-radius:8px;cursor:pointer;width:100%;text-align:left}
.mini:hover,.mini:focus-visible{background:var(--hv2)}
.mini .art{width:44px;box-shadow:none;border-radius:4px}.mini .art.round{border-radius:50%}
.mini .art .ini{font-size:15px}
.mini .t{min-width:0}.mini em{font-style:normal;color:var(--m);font-size:12px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:12px}
.ac{background:var(--hv2);border-radius:12px;padding:14px;text-align:center;opacity:.55}
.ac.ok{opacity:1;background:var(--hv);box-shadow:inset 0 0 0 1px var(--g)}
.ac .ic{width:44px;height:44px;border-radius:50%;background:var(--hv);display:grid;place-items:center;margin:0 auto 8px;color:var(--m)}
.ac.ok .ic{background:var(--g);color:#14102a}
.ac b{display:block;font-size:13px}.ac span{font-size:11px;color:var(--m);display:block}
.bar2{height:4px;background:var(--bar);border-radius:4px;margin-top:8px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--g)}
.form{padding:10px 24px 18px;display:grid;gap:14px;max-width:580px}
.form label{display:grid;gap:6px;font-weight:600}
.form textarea{width:100%;min-height:90px;background:var(--fld);color:var(--t);border:1px solid transparent;border-radius:14px;padding:12px 16px;font:inherit;resize:vertical}
.form textarea:focus{border-color:var(--t);outline:0}
.hint{color:var(--m);font-size:12px;font-weight:400}
.meter{height:6px;border-radius:6px;background:var(--bar);overflow:hidden}
.meter i{display:block;height:100%;width:0;transition:width .25s,background .25s}
.form .sw{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--hv);cursor:pointer;font-weight:600}
.form .sw input[type=checkbox]{appearance:none;-webkit-appearance:none;width:46px;height:26px;border-radius:999px;background:#8a8a9a;padding:0;border:0;position:relative;flex:none;cursor:pointer;transition:background .2s}
.form .sw input[type=checkbox]::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.form .sw input[type=checkbox]:checked{background:var(--g)}
.form .sw input[type=checkbox]:checked::after{transform:translateX(20px)}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px #ffffff33}
.swatch[aria-pressed=true]{border-color:var(--t)}
.sess{display:flex;gap:14px;align-items:center;background:var(--p);border-radius:12px;padding:14px}
.dot{width:10px;height:10px;border-radius:50%;background:#4ade80;flex:none;box-shadow:0 0 0 4px #4ade8033}

let kvDb=null,kvN=0;const kvMem=new Map();
function kvOpen(){return kvDb||(kvDb=new Promise(res=>{try{

 r.onupgradeneeded=()=>{const st=r.result.createObjectStore('kv',{keyPath:'k'});st.createIndex('t','t')};

 const db=await kvOpen();if(!db)return null;
 return new Promise(res=>{try{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>{const v=q.result?q.result.v:null;if(v!=null)kvMem.set(k,v);res(v)};q.onerror=()=>res(null)}catch(e){res(null)}})}

 const ins=el.querySelector('ins'),off=()=>{el.dataset.f='x';el.hidden=true};
 new MutationObserver((m,o)=>{const st=ins.getAttribute('data-ad-status');if(st==='unfilled'){off();o.disconnect()}else if(st==='filled')o.disconnect()}).observe(ins,{attributes:true,attributeFilter:['data-ad-status']});
 setTimeout(()=>{if(el.dataset.f==='1'&&!ins.querySelector('iframe')&&!ins.getAttribute('data-ad-status'))off()},12000);

 <div class="card2"><h4>Dispositivos</h4>${bars((d.by_device||[]).map(x=>({n:x.n,c:x.device})),x=>'<span>'+esc(devN(x.c))+'</span>')}</div>
 ${visits}
 <div class="card2 wide"><h4>Usuarios conectados<small>${num(d.connected)}${(d.users||[]).length<d.connected?' · se muestran '+(d.users||[]).length:''}</small></h4>${users?`<div class="ut"><div class="ur h"><span>Usuario</span><span>País</span><span>Dispositivo</span><span>Estado</span><span>Última actividad</span></div>${users}</div>`:'<p class="hint" style="margin-top:10px">Nadie conectado en este momento.</p>'}</div></div>`}

function admStats(){
 const s=adm.stats;if(!s)return adm.err?'':'<p class="adm-note">Cargando…</p>';
 const m=adm.metric==='plays',list=m?s.plays_by_country:s.visitors_by_country,top=s.top_songs||[],shown=adm.all?top:top.slice(0,25);
 const t=x=>[[ 'Entradas hoy',s.today],['Entradas 7 días',s.week],['Entradas 30 días',s.month],['Reproducciones',s.plays_total],['Reprod. hoy',s.plays_today],['Usuarios (pendientes: '+num(s.pending)+')',s.users_total]].map(y=>`<div class="st"><b>${num(y[1])}</b><span>${y[0]}</span></div>`).join('');
 return`<div class="stats4 g3">${t()}</div><p class="adm-note">Una reproducción cuenta tras 20 s de escucha. Solo se registran usuarios que aceptaron compartir estadísticas.</p><div class="cards">
 <div class="card2 wide"><h4>Mapa por país</h4><div class="chips" style="padding:8px 0" role="group">${[['visitors','Visitantes (30 días)'],['plays','Reproducciones']].map(c=>`<button class="chip" data-ad="metric" data-id="${c[0]}" aria-pressed="${adm.metric===c[0]}">${c[1]}</button>`).join('')}</div>${mapSVG(cnt(list),m?'reproducciones':'visitantes')}</div>
 <div class="card2"><h4>Países<small>${m?'reproducciones':'visitantes'}</small></h4>${bars((list||[]).slice(0,15),x=>ccb(x.country)+'<span>'+esc(cn(x.country))+'</span>')}</div>
 <div class="card2"><h4>Canciones más escuchadas<small>${top.length} con reproducciones</small></h4>${bars(shown.map((x,i)=>({n:x.plays,t:x.title,a:x.artist,i,id:x.song_id})),x=>`<span class="rk">${x.i+1}</span><span>${esc(x.t||'(canción eliminada)')}${x.a?` <em>${esc(x.a)}</em>`:''}</span>`)}${top.length>25?`<button class="sbtn" data-ad="allsongs" style="margin-top:8px">${adm.all?'Ver solo las 25 primeras':'Ver todas ('+top.length+')'}</button>`:''}</div></div>`}

function admUserList(){
 const t=adm.uq.toLowerCase(),u=(adm.users||[]).filter(x=>!t||String(x.email||'').toLowerCase().includes(t)||String(x.name||'').toLowerCase().includes(t));
 return u.map(x=>{const self=x.id===me.id,b=(k,l,c)=>`<button class="sbtn ${c||''}" data-ad="uset" data-id="${esc(x.id)}" data-k="${k}">${l}</button>`;
  return`<div class="arow"><div class="ai"><b>${esc(x.name||String(x.email||'').split('@')[0])}</b> ${x.role==='admin'?'<span class="badge a">Admin</span>':''} ${x.blocked?'<span class="badge">Bloqueado</span>':x.approved?'<span class="badge">Con acceso</span>':'<span class="badge">Pendiente</span>'}<br><small class="hint">${esc(x.email||'')} · ${x.last_sign_in?'último acceso '+esc(new Date(x.last_sign_in).toLocaleString('es')):'sin accesos'}</small></div>${self?'<small class="hint">(tú)</small>':`<div class="acts">${x.approved&&!x.blocked?b('unapprove','Quitar acceso'):b('approve','Dar acceso')}${b(x.blocked?'unblock':'block',x.blocked?'Desbloquear':'Bloquear','danger')}${b(x.role==='admin'?'demote':'promote',x.role==='admin'?'Quitar admin':'Hacer admin')}</div>`}</div>`}).join('')||'<p class="adm-note">Sin resultados.</p>'}
function admUsers(){
 if(!adm.users)return adm.err?'':'<p class="adm-note">Cargando…</p>';
 return`<div class="admf" style="padding-bottom:6px"><input id="uq" type="search" placeholder="Buscar por nombre o correo" value="${esc(adm.uq)}" autocomplete="off"><p class="hint">${num(adm.users.length)} cuentas. «Quitar acceso» o «Bloquear» dejan al usuario fuera de la biblioteca.</p></div><div id="ulist">${admUserList()}</div>`}

function admInv(){
 const l=adm.invites;
 return`<div class="admf"><label>Correos a invitar<textarea id="inv-t" placeholder="amigo@correo.com, otra@correo.com" autocapitalize="off"></textarea><span class="hint">Uno por línea o separados por coma. Si el correo ya tiene cuenta, recibe acceso al instante; si no, entrará al registrarse (con Google o con correo) usando ese mismo correo.</span></label><button class="btn" data-ad="invsend">Invitar</button><button class="btn ghost" data-ad="copylink">Copiar enlace de la app</button></div>
 <div class="sec-h"><h3>Invitaciones</h3></div>${!l?'<p class="adm-note">Cargando…</p>':l.length?l.map(i=>`<div class="arow"><div class="ai"><b>${esc(i.email)}</b><br><small class="hint">${i.used_at?'Usada el '+esc(new Date(i.used_at).toLocaleDateString('es')):'Pendiente'} · creada ${esc(new Date(i.created_at).toLocaleDateString('es'))}</small></div><button class="sbtn danger" data-ad="invdel" data-id="${esc(i.email)}">Eliminar</button></div>`).join(''):'<p class="adm-note">Aún no hay invitaciones.</p>'}<p class="adm-note">Eliminar una invitación no quita el acceso a quien ya entró: para eso usa la pestaña Usuarios.</p>`}

function admAds(){
 const a={...ADS_DEF,...(T2.ads||{})},sw=(id,t,d,on)=>`<label class="sw"><span>${t}<br><small class="hint">${d}</small></span><input type="checkbox" id="${id}" ${on?'checked':''}></label>`;
 return`<div class="admf"><p class="hint">Anuncios de Google AdSense. Todo empieza apagado. La música nunca se detiene ni se interrumpe: los anuncios son recuadros fijos dentro de la página, sin ventanas emergentes, sin sonido y sin superponerse al reproductor ni a los menús.</p>
 ${sw('ad-top','Banner superior','Un recuadro discreto «Publicidad» al inicio de Inicio, Biblioteca, Favoritos y Listas.',a.top)}
 ${sw('ad-lib','Bloque en la Biblioteca','Un recuadro al final de la lista de canciones de la Biblioteca.',a.library)}
 ${sw('ad-wv','Mostrar también dentro de la app Android (WebView)','Déjalo apagado hasta confirmar que tu cuenta de Google lo permite para tu app.',a.webview)}
 <label>ID de editor de AdSense<input id="ad-cl" value="${esc(a.client)}" placeholder="ca-pub-1234567890123456" autocapitalize="off" autocomplete="off"></label>
 <label>ID del bloque · banner superior<input id="ad-st" value="${esc(a.slot_top)}" placeholder="1234567890" inputmode="numeric" autocomplete="off"></label>
 <label>ID del bloque · biblioteca<input id="ad-sl" value="${esc(a.slot_library)}" placeholder="1234567890" inputmode="numeric" autocomplete="off"></label>
 <p id="ad-msg" class="hint" role="status"></p><button class="btn" data-ad="adsave">Guardar</button>
 <p class="hint">Estado en este dispositivo: banner ${adsElig('top')?'<b>visible</b>':'oculto'} · biblioteca ${adsElig('library')?'<b>visible</b>':'oculta'}. Los anuncios no se piden desde localhost ni desde un archivo local.</p></div>`}

function admPaint(force){
 const r=$('#adm');if(!r||view!=='admin')return;
 const f=document.activeElement;
 if(!force&&f&&r.contains(f)&&/^(INPUT|TEXTAREA|SELECT)$/.test(f.tagName)){const l=$('#ulist');if(l&&adm.tab==='users')l.innerHTML=admUserList();return}
 if(!force&&adm.tab==='ads')return;
 r.innerHTML=admBody()}
async function admRpc(name,args){
 const{data,error}=await sb.rpc(name,args||{});
 if(error){const m=(error.code||'')+' '+(error.message||'');
  adm.err=/42501|No autorizado/.test(m)?'No autorizado: solo el administrador puede ver este panel.':/PGRST202|Could not find|does not exist/i.test(m)?'Falta instalar la base de datos de la tanda 2: ejecuta el PASO 1 de supabase-tanda2.sql.':'No se pudo cargar: '+(error.message||'error');return null}
 adm.err='';return data}
async function admLoad(){
 if(view!=='admin'||adm.busy)return;adm.busy=true;const t=adm.tab;
 try{
  if(t==='live'){const d=await admRpc('admin_live');if(d){adm.live=d;adm.off=Date.parse(d.now)-Date.now();
    if(Date.now()-adm.lastStats>30000){const s=await admRpc('admin_stats');if(s){adm.stats=s;adm.lastStats=Date.now()}}}}
  else if(t==='stats'){const s=await admRpc('admin_stats');if(s){adm.stats=s;adm.lastStats=Date.now()}}
  else if(t==='users'){const u=await admRpc('admin_users');if(u)adm.users=u}
  else if(t==='inv'){const r=await sb.from('invites').select('*').order('created_at',{ascending:false});
   if(r.error)adm.err=/does not exist|PGRST205/.test(r.error.message||r.error.code||'')?'Falta instalar la base de datos de la tanda 2 (PASO 1).':'No se pudo cargar: '+r.error.message;else{adm.invites=r.data||[];adm.err=''}}
 }catch(e){adm.err='No se pudo cargar. Revisa tu conexión.'}
 adm.busy=false;if(view==='admin'&&adm.tab===t)admPaint(t!=='ads')}
function admStart(){
 admStop();
 adm.t=setInterval(()=>{if(document.visibilityState==='visible'&&adm.tab==='live')admLoad()},5000);
 try{if(sb.channel)adm.ch=sb.channel('adm-presence').on('postgres_changes',{event:'*',schema:'public',table:'presence'},()=>{clearTimeout(adm.rt);adm.rt=setTimeout(()=>{if(adm.tab==='live')admLoad()},1500)}).subscribe()}catch(e){adm.ch=null}
 admLoad()}
function admStop(){clearInterval(adm.t);adm.t=null;clearTimeout(adm.rt);if(adm.ch){try{sb.removeChannel(adm.ch)}catch(e){}adm.ch=null}}
function admBind(){admStart()}
function tip(e){
 const t=e.target&&e.target.closest?e.target.closest('[data-cc]'):null;let el=$('#mtip');
 if(!t||t.dataset.n==='0'){if(el)el.style.display='none';return}
 if(!el){el=document.createElement('div');el.id='mtip';document.body.appendChild(el)}
 el.textContent=cn(t.dataset.cc)+': '+num(t.dataset.n);el.style.display='block';
 el.style.left=Math.min(innerWidth-170,e.clientX+12)+'px';el.style.top=(e.clientY+14)+'px'}
function admWire(){
 const v=$('#view');if(!v)return;
 v.addEventListener('click',admClick);
 v.addEventListener('input',e=>{if(view==='admin'&&e.target.id==='uq'){adm.uq=e.target.value;const l=$('#ulist');if(l)l.innerHTML=admUserList()}});
 v.addEventListener('mousemove',tip);v.addEventListener('mouseleave',tip);v.addEventListener('click',tip)}
async function admClick(e){
 if(view!=='admin')return;
 const b=e.target.closest('[data-ad]');if(!b)return;
 const a=b.dataset.ad,id=b.dataset.id;
 if(a==='tab'){adm.tab=id;adm.err='';$$('#view .chips [data-ad=tab]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.id===id));syncUrl();admPaint(true);return admLoad()}
 if(a==='metric'){adm.metric=id;return admPaint(true)}
 if(a==='allsongs'){adm.all=!adm.all;return admPaint(true)}
 if(a==='copylink'){try{await navigator.clipboard.writeText(location.origin+location.pathname);toast('Enlace copiado.')}catch(x){toast(location.origin+location.pathname)}return}
 if(a==='invsend'){
  const raw=($('#inv-t').value||'').split(/[\s,;]+/).map(x=>x.trim().toLowerCase()).filter(Boolean),ok=raw.filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x));
  if(!ok.length)return toast('Escribe al menos un correo válido.');
  const{data,error}=await sb.rpc('admin_invite',{p_emails:ok});
  if(error)return toast('No se pudo invitar: '+error.message);
  $('#inv-t').value='';toast(num(data)+(data===1?' invitación registrada.':' invitaciones registradas.')+(raw.length>ok.length?' Se ignoraron correos no válidos.':''));return admLoad()}
 if(a==='invdel'){
  if(!confirm('¿Eliminar la invitación de '+id+'?'))return;
  const{error}=await sb.from('invites').delete().eq('email',id);
  if(error)return toast('No se pudo eliminar.');toast('Invitación eliminada.');return admLoad()}
 if(a==='uset'){
  const u=(adm.users||[]).find(x=>x.id===id);if(!u)return;
  const k=b.dataset.k,n={approved:!!u.approved,blocked:!!u.blocked,role:u.role==='admin'?'admin':'user'},nm=u.email||u.name||'';
  const msg={unapprove:'¿Quitarle el acceso a '+nm+'?',block:'¿Bloquear a '+nm+'?',promote:'¿Hacer administrador a '+nm+'? Podrá ver todas las estadísticas y usuarios.',demote:'¿Quitar el rol de administrador a '+nm+'?'}[k];
  if(msg&&!confirm(msg))return;
  if(k==='approve'){n.approved=true;n.blocked=false}else if(k==='unapprove')n.approved=false;else if(k==='block')n.blocked=true;else if(k==='unblock')n.blocked=false;else if(k==='promote'){n.role='admin';n.approved=true}else if(k==='demote')n.role='user';
  const r=await admRpc('admin_set_user',{p_id:id,p_approved:n.approved,p_blocked:n.blocked,p_role:n.role});
  if(adm.err){toast(adm.err);adm.err='';return}
  toast('Cambios guardados.');return admLoad()}
 if(a==='adsave'){
  const v={top:$('#ad-top').checked,library:$('#ad-lib').checked,webview:$('#ad-wv').checked,client:$('#ad-cl').value.trim(),slot_top:$('#ad-st').value.trim(),slot_library:$('#ad-sl').value.trim()},m=$('#ad-msg');
  if(v.client&&!ADC.test(v.client))return m.textContent='El ID de editor debe verse como ca-pub-1234567890123456.';
  if((v.top||v.library)&&!v.client)return m.textContent='Para activar anuncios escribe tu ID de editor.';
  if(v.top&&!/^\d{6,20}$/.test(v.slot_top))return m.textContent='Falta el ID numérico del bloque del banner superior.';
  if(v.library&&!/^\d{6,20}$/.test(v.slot_library))return m.textContent='Falta el ID numérico del bloque de la biblioteca.';
  if(v.slot_top&&!/^\d{6,20}$/.test(v.slot_top)||v.slot_library&&!/^\d{6,20}$/.test(v.slot_library))return m.textContent='Los IDs de bloque son solo números.';
  m.textContent='Guardando…';
  const{error}=await sb.from('app_settings').upsert({key:'ads',value:v,updated_at:new Date().toISOString()});
  if(error)return m.textContent='No se pudo guardar: '+error.message;
  T2.ads={...ADS_DEF,...v};T2.adAt=Date.now();$$('.ad').forEach(el=>{el.innerHTML='';delete el.dataset.f;el.hidden=true});
  toast('Publicidad guardada.');admPaint(true);return adsApply()}}

/* ---------- Privacidad en Ajustes ---------- */
function pfPriv(){
 const ads=T2.ads&&(T2.ads.top||T2.ads.library);
 return`<div class="form"><h4>Privacidad${ads?' y anuncios':''}</h4><label class="sw"><span>Compartir estadísticas de uso<br><small class="hint">País aproximado (2 letras), tipo de dispositivo, si estás escuchando y qué canciones. Nunca tu IP ni tu contraseña.</small></span><input type="checkbox" id="t-tele" ${T2.tele==='y'?'checked':''}></label>${ads?`<label class="sw"><span>Anuncios no personalizados<br><small class="hint">Pide a Google anuncios que no usen tu historial. Surte efecto al recargar.</small></span><input type="checkbox" id="t-npa" ${prefs.npa?'checked':''}></label>`:''}<a class="lnk" href="privacidad.html" target="_blank" rel="noopener">Política de privacidad</a></div>`}

loadPrefs();boot();
</script>
</body>
