<style>
:root{--bg0:#000;--bg:#121212;--p:#1a1a1a;--p2:#2a2a2a;--p3:#3a3a3a;--fld:#2a2a2a;--t:#fff;--m:#b3b3b3;--g:#9b8cff;--gt:var(--g);--hv:#ffffff1a;--hv2:#ffffff14;--hv3:#ffffff26;--bar:#ffffff22;--line:#727272;--inv:#fff;--invt:#000;--dlg:#282828;--scrim:#000a;--np1:#35308f;--hdg:#35308f99;--pl:84px;--nv:58px;color-scheme:dark}
[data-theme=light]{--bg0:#e6e6ee;--bg:#ffffff;--p:#f3f3f8;--p2:#e9e9f1;--p3:#dcdce8;--fld:#ececf4;--t:#14141c;--m:#5d5d70;--gt:color-mix(in srgb,var(--g) 50%,#000);--hv:#00000012;--hv2:#0000000d;--hv3:#0000001c;--bar:#00000022;--line:#b3b3c4;--inv:#14141c;--invt:#fff;--dlg:#fff;--scrim:#0006;--np1:#d4ccff;--hdg:#9b8cff55;color-scheme:light}
[data-theme=light] .dh{background:linear-gradient(color-mix(in srgb,var(--c,#9b8cff) 35%,#fff),transparent)}
[data-theme=light] .st,[data-theme=light] .card2,[data-theme=light] .sess{box-shadow:0 1px 0 #00000012}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg0);color:var(--t);font:400 14px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--g);outline-offset:2px}
svg{width:22px;height:22px;fill:currentColor;flex:none}
input:not([type=range]){width:100%;background:var(--fld);color:var(--t);border:1px solid transparent;border-radius:999px;padding:12px 18px;font:inherit}
input:not([type=range]):focus{border-color:var(--t);outline:0}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:16px;background:transparent;cursor:pointer;--f:0%}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:linear-gradient(90deg,var(--g) var(--f),var(--bar) var(--f))}
input[type=range]::-moz-range-track{height:4px;border-radius:4px;background:var(--bar)}
input[type=range]::-moz-range-progress{height:4px;border-radius:4px;background:var(--g)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 6px #0007;transform:scale(0);transition:transform .15s}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff;box-shadow:0 1px 6px #0007;transform:scale(0);transition:transform .15s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:active::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{transform:scale(1)}
input[type=range]:hover::-moz-range-thumb,input[type=range]:active::-moz-range-thumb,input[type=range]:focus-visible::-moz-range-thumb{transform:scale(1)}
@media(hover:none){input[type=range]::-webkit-slider-thumb{transform:scale(1)}input[type=range]::-moz-range-thumb{transform:scale(1)}}
.mut{color:var(--m)}
.auth{max-width:380px;margin:8vh auto;padding:24px 20px;display:grid;gap:14px}
.auth h1{font-size:28px;font-weight:800;text-align:center}
.auth p{text-align:center}
.auth label{display:grid;gap:6px;font-weight:600}
.btn{background:var(--g);color:#14102a;font-weight:800;border-radius:999px;padding:13px 24px;text-align:center;display:block;text-decoration:none}
.btn:hover{transform:scale(1.03)}
.btn.ghost{background:none;color:var(--t);border:1px solid var(--line)}
.lnk{color:var(--m);text-decoration:underline;font-size:13px}
.msg{min-height:20px;font-size:13px;color:#ff7d8a;text-align:center}.msg.ok{color:var(--gt)}
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:1fr var(--pl);height:100vh;height:100dvh;gap:8px;padding:8px}
.sort{background:var(--fld);color:var(--t);border:0;border-radius:999px;padding:10px 16px;font:inherit;cursor:pointer}
.sort:focus-visible{outline:2px solid var(--g)}
.rm{color:var(--m)}.rm:hover{color:#ff7d8a}
.np-seek{display:flex;gap:8px;align-items:center;color:var(--m);font-size:12px;margin:0 0 16px}
.np-ctl{display:flex;gap:10px;align-items:center;justify-content:center;margin:0 0 18px}
.np-ctl .play{width:48px;height:48px}
@media(min-width:801px){.np-ctl,.np-seek{display:none}}
nav{grid-row:1;background:var(--bg);border-radius:10px;padding:14px 8px;display:flex;flex-direction:column;gap:2px}
.brand{display:flex;align-items:center;gap:10px;padding:6px 14px 18px;font-size:20px;font-weight:800}
.brand i{width:34px;height:34px;border-radius:50%;background:var(--g);color:#14102a;display:grid;place-items:center}
nav button{display:flex;align-items:center;gap:16px;padding:12px 14px;border-radius:8px;color:var(--m);font-weight:600;font-size:15px;text-align:left}
nav button:hover{color:var(--t)}
nav button[aria-current=page]{color:var(--t);background:var(--p2)}
nav .sp{flex:1}
main{background:var(--bg);border-radius:10px;overflow:auto;min-width:0}
.hd{padding:28px 24px 12px;background:linear-gradient(var(--hdg),transparent)}
.hd h2{font-size:34px;font-weight:800;letter-spacing:-.5px;margin-bottom:14px}
.hd input{max-width:420px}
.bar{display:flex;gap:10px;align-items:center;padding:14px 24px;flex-wrap:wrap}
.big{width:52px;height:52px;border-radius:50%;background:var(--g);color:#14102a;display:grid;place-items:center}
.big:hover{transform:scale(1.06)}
.songs{list-style:none;padding:0 12px 24px}
.songs li{display:grid;grid-template-columns:36px 1fr auto 38px 38px 46px;gap:10px;align-items:center;padding:6px 12px;border-radius:6px;cursor:pointer}
.songs li:hover{background:var(--hv)}
.songs li.on .t b{color:var(--gt)}
.n{color:var(--m);text-align:center;font-variant-numeric:tabular-nums}
li.on .n{color:var(--gt)}
.tt{display:flex;gap:12px;align-items:center;min-width:0}
.tt img,.cov{width:44px;height:44px;border-radius:4px;object-fit:cover;background:var(--p2);flex:none}
.t{min-width:0}.t b,.t span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t span{color:var(--m);font-size:13px}
.d{color:var(--m);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.ib{position:relative;display:grid;place-items:center;width:38px;height:38px;border-radius:50%;color:var(--m)}
.ib:hover{color:var(--t)}.ib[aria-pressed=true]{color:var(--gt)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:8px 24px 24px}
.card{background:var(--p);border-radius:8px;padding:14px;text-align:left;width:100%}
.card:hover{background:var(--p2)}
.card .cv{aspect-ratio:1;border-radius:6px;background:linear-gradient(135deg,#4b3fd1,#9b8cff);display:grid;place-items:center;margin-bottom:12px}
.card .cv svg{width:44px;height:44px}
.card b{display:block}
.pad{padding:0 24px 24px;display:grid;gap:10px;max-width:520px}
.mt{padding:40px 24px}
.player{grid-column:1/-1;position:relative;overflow:hidden;background:linear-gradient(100deg,hsl(var(--ph,250) 38% 16%),var(--bg) 58%);border-radius:14px;box-shadow:inset 0 0 0 1px var(--hv);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);align-items:center;gap:20px;padding:0 18px}
[data-theme=light] .player{background:linear-gradient(100deg,hsl(var(--ph,250) 70% 91%),var(--bg) 58%)}
.player .cov{width:56px;height:56px;border-radius:8px;box-shadow:0 6px 16px #0006}
.player .t b{font-size:15px}
.mp{display:none;position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--bar);--f:0%}.mp i{display:block;height:100%;width:var(--f);background:var(--g)}
.now{display:flex;align-items:center;gap:12px;min-width:0}
.ctr{display:grid;gap:2px;justify-items:center}
.btns{display:flex;align-items:center;gap:8px}
.play{width:44px;height:44px;border-radius:50%;background:var(--g);color:#14102a;display:grid;place-items:center;box-shadow:0 6px 18px color-mix(in srgb,var(--g) 42%,transparent);transition:transform .15s}.play svg{width:24px;height:24px}
.play:hover{transform:scale(1.07)}
.seek{display:flex;gap:8px;align-items:center;width:100%;max-width:640px;color:var(--m);font-size:12px;font-variant-numeric:tabular-nums}.seek span{width:34px}.seek span:first-child{text-align:right}
.rt{display:flex;justify-content:flex-end;align-items:center;gap:6px}
.vol{display:flex;align-items:center;gap:4px}.vol input{width:104px}.vol output{width:26px;font-size:11px;color:var(--m);font-variant-numeric:tabular-nums;text-align:right}
.vi .w1,.vi .w2,.vi .x{display:none}#vm[data-l="1"] .w1,#vm[data-l="2"] .w1,#vm[data-l="2"] .w2,#vm[data-l="0"] .x{display:block}
.btns .ib[aria-pressed=true]::after,#rp:not([data-m="0"])::after{content:'';position:absolute;bottom:3px;left:50%;margin-left:-2px;width:4px;height:4px;border-radius:50%;background:currentColor}
#rp[data-m="2"]::before{content:'1';position:absolute;top:5px;right:5px;font-size:9px;font-weight:800}
.eqs{margin:0 0 18px}.eqs[hidden]{display:none}
.eqh{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.eqh h3{font-size:18px;font-weight:800}
.tgl{width:46px;height:26px;border-radius:999px;background:#8a8a9a;position:relative;flex:none;transition:background .2s}
.tgl i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.tgl[aria-checked=true]{background:var(--g)}.tgl[aria-checked=true] i{transform:translateX(20px)}
.eqp{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px;scrollbar-width:none}.eqp .chip{flex:none;padding:6px 14px}
.eqbox{position:relative;height:200px;background:var(--hv2);border-radius:14px}
#eqc{position:absolute;inset:0;width:100%;height:100%}
.eqbands{position:absolute;left:26px;right:8px;top:0;bottom:0;display:grid;grid-template-columns:repeat(10,1fr)}
.eb{position:relative;touch-action:none;cursor:ns-resize;outline:0}
.eb .tr{position:absolute;top:14px;height:150px;left:50%;width:4px;margin-left:-2px;border-radius:4px;background:var(--bar)}
.eb .fl{position:absolute;left:0;right:0;border-radius:4px;background:var(--g)}
.eb .th{position:absolute;left:2px;top:var(--y,50%);width:18px;height:18px;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 2px 8px #0007}
.eb:focus-visible .th{outline:2px solid var(--g);outline-offset:2px}
.eb b{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:11px;font-weight:700}
.eb em{position:absolute;bottom:5px;left:0;right:0;text-align:center;font-style:normal;font-size:10px;color:var(--m);font-variant-numeric:tabular-nums}
.eqs.off .th{background:#b5b5c2}.eqs.off .fl{background:var(--m)}
#rp[data-m="1"],#sh[aria-pressed=true],#rp[data-m="2"]{color:var(--gt)}
dialog{margin:auto;background:var(--dlg);color:var(--t);border:0;border-radius:12px;padding:20px;width:min(92vw,360px);max-height:86vh;overflow:auto}
dialog::backdrop{background:var(--scrim)}dialog h3{margin-bottom:12px}
.row{display:block;width:100%;text-align:left;padding:12px;border-radius:8px}.row:hover{background:var(--hv)}
#toast{position:fixed;left:50%;bottom:calc(var(--pl) + 24px);transform:translateX(-50%);background:var(--inv);color:var(--invt);padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.show{opacity:1}
.logo{width:120px;height:120px;border-radius:26px;margin:0 auto;display:block}
.brand img{width:34px;height:34px;border-radius:8px}
.now{cursor:pointer}
#np{position:fixed;z-index:3;inset:8px 8px calc(var(--pl) + 16px) 276px;background:linear-gradient(var(--np1),var(--bg) 65%);border-radius:10px;overflow:auto;padding:20px 28px;display:grid;grid-template-columns:minmax(240px,1fr) 1.2fr;gap:32px;align-content:start}
#np[hidden]{display:none}
.disc{width:min(100%,360px);aspect-ratio:1;border-radius:50%;margin:16px auto;background:repeating-radial-gradient(circle,#0c0c0c 0 2px,#1d1d1d 3px 4px);box-shadow:0 14px 40px #000a;display:grid;place-items:center;animation:spin 7s linear infinite;animation-play-state:paused}
.disc.spin{animation-play-state:running}
.disc img{width:38%;aspect-ratio:1;border-radius:50%;object-fit:cover;background:var(--p2);box-shadow:0 0 0 6px #0009}
@keyframes spin{to{transform:rotate(360deg)}}
#np h2{font-size:30px;font-weight:800;letter-spacing:-.5px}
.info{display:grid;gap:2px;margin:12px 0 20px;color:var(--m)}
.lyr{white-space:pre-wrap;font-size:18px;line-height:1.7;font-weight:600;margin-bottom:12px;max-height:50vh;overflow:auto;position:relative;scroll-behavior:smooth}
.ll{white-space:normal;font-size:24px;font-weight:800;line-height:1.3;margin:0 0 14px;opacity:.38;cursor:pointer;transition:opacity .25s,transform .25s;transform-origin:left}
.ll:hover{opacity:.7}.ll.on{opacity:1;transform:scale(1.04)}
.adj[hidden]{display:none}
.adj{display:flex;gap:8px;align-items:center;margin-bottom:14px;color:var(--m);font-size:12px}
.adj button{border:1px solid var(--line);border-radius:999px;padding:6px 12px;color:var(--t);font-size:12px}
.lyr.empty{color:var(--m);font-weight:400;font-size:14px}
#np textarea{width:100%;min-height:260px;background:var(--fld);color:var(--t);border:1px solid var(--line);border-radius:10px;padding:12px;font:inherit;margin-bottom:10px}

.row-h{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scroll-snap-type:x proximity;scrollbar-width:thin}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;padding:18px 24px 6px}

.sec-h button{color:var(--m);font-weight:700;font-size:13px}.sec-h button:hover{color:var(--t);text-decoration:underline}
.tile{flex:none;width:172px;text-align:left;padding:12px;border-radius:10px;scroll-snap-align:start;transition:background .2s;cursor:pointer;min-width:0}
.tile:hover,.tile:focus-visible{background:var(--p2)}
.tile>div{position:relative}
.art{position:relative;aspect-ratio:1;width:100%;border-radius:8px;overflow:hidden;background:var(--p2);display:grid;box-shadow:0 8px 24px #0006}
.art.round{border-radius:50%}
.art img{width:100%;height:100%;object-fit:cover;display:block}
.art.mos{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.art .ini{display:grid;place-items:center;font-size:40px;font-weight:800;color:#fff;text-shadow:0 2px 12px #0006}
.art .ini svg{width:38%;height:38%;opacity:.9}
.tile b{display:block;margin-top:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile .s{color:var(--m);font-size:13px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl{position:absolute;right:8px;bottom:8px;width:46px;height:46px;border-radius:50%;background:var(--g);color:#14102a;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;box-shadow:0 8px 16px #0006}
.pl:hover{transform:scale(1.06)}
.tile:hover .pl,.tile:focus-within .pl,.qk:hover .pl,.qk:focus-within .pl{opacity:1;transform:none}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;padding:0 24px 8px}

.qk .pl svg{width:18px;height:18px}
.grid .tile{width:auto}
.chips{display:flex;gap:8px;padding:4px 24px 8px;flex-wrap:wrap}
.chip{padding:8px 16px;border-radius:999px;background:var(--fld);font-weight:600;display:inline-flex;gap:8px;align-items:center}.chip svg{width:16px;height:16px}
.chip:hover{background:var(--p3)}.chip[aria-pressed=true]{background:var(--inv);color:var(--invt)}
.dh{display:flex;gap:24px;align-items:flex-end;padding:32px 24px 12px;background:linear-gradient(var(--c,#35308f),transparent)}
.dh .art{width:200px;flex:none;box-shadow:0 14px 40px #0008}

.dh h2{font-size:clamp(28px,5vw,56px);font-weight:800;letter-spacing:-1px;line-height:1.05;margin:6px 0 10px}
@media(hover:none){.pl{opacity:1;transform:none;width:38px;height:38px}.pl svg{width:18px;height:18px}}
@media(max-width:800px){.row-h{padding:4px 8px 12px}.sec-h{padding:16px 16px 6px}.quick{padding:0 16px 8px;grid-template-columns:1fr 1fr;gap:8px}.qk{height:52px}.qk .art{width:52px;height:52px}.qk b{font-size:13px;padding-right:44px}.qk .pl{display:none}.chips{padding:4px 16px 8px}.tile{width:142px;padding:8px}.dh{flex-direction:column;align-items:flex-start;gap:16px;padding:20px 16px 8px}.dh .art{width:150px}.grid{padding:8px 12px 24px;gap:8px}}

function setup(){

function login(){

 {const qs=new URLSearchParams(location.search.slice(1)+'&'+location.hash.slice(1)),er=qs.get('error_description');if(er){say(er.replace(/\+/g,' '));try{history.replaceState(null,'',location.pathname)}catch(e){}}}

 $('#up').onclick=async()=>{const[email,password]=v();if(password.length<6)return say('La contraseña necesita al menos 6 caracteres.');

async function load(){

 try{recent=JSON.parse(localStorage.getItem('rc:'+me.id)||'[]')}catch(e){recent=[]}

 shell();render();if(qi<0)restorePb();
 if(s.error)toast('No se pudieron cargar las canciones.')}
async function signed(s){

  if(a==='coll')return openColl(b.dataset.k);
  if(a==='pcoll'){const c=reg[b.dataset.k];return c&&c.items.length&&play(c.items,0)}
  if(a==='psong'){const l=hl[b.dataset.l]||[];return l.length&&play(l,+b.dataset.i)}
  if(a==='more'){libTab=id;view='lib';coll=null;curList=null;q='';render();return go()}
  if(a==='shufcoll'){shuffle=true;const sh=$('#sh');if(sh)sh.setAttribute('aria-pressed','true');return shown.length&&play(shown,Math.floor(Math.random()*shown.length))}
  if(a==='theme'){prefs.theme=id;savePrefs();return render()}
  if(a==='keys')return shortcutsHelp();
  if(a==='glink')return linkGoogle();
  if(a==='ren')return renList();
  if(a==='surprise'){shuffle=true;const sh=$('#sh');if(sh)sh.setAttribute('aria-pressed','true');return songs.length&&play(seeded(songs,Date.now()),0)}
  if(a==='ptab'){profTab=id;render();return go()}
  if(a==='psave')return saveProfile();
  if(a==='avpick'){const f=$('#avf');return f&&f.click()}
  if(a==='avdel')return delAvatar();
  if(a==='pwsave')return savePass();
  if(a==='emsave')return saveEmail();
  if(a==='others')return closeOthers();
  if(a==='outall'){if(!confirm('¿Cerrar sesión en todos tus dispositivos, incluido este?'))return;return sb.auth.signOut({scope:'global'})}
  if(a==='accent'){prefs.accent=id;savePrefs();sb.auth.updateUser({data:{accent:id}}).then(r=>{if(r.data&&r.data.user){me=r.data.user;meta=me.user_metadata||{}}});return render()}
  if(a==='eye'){$$('.pwf').forEach(x=>x.type=x.type==='password'?'text':'password');return}
  if(a==='export')return exportData();
  if(a==='clrhist')return clearHist();
  if(a==='clrlyr')return clearLyr();
  if(a==='install'&&deferred){deferred.prompt();deferred=null;return render()}
  if(a==='out')return sb.auth.signOut()}
 const li=e.target.closest('li[data-i]');if(li)play(shown,+li.dataset.i)}

async function toggleFav(id){
 const had=favs.has(id);had?favs.delete(id):favs.add(id);render();
 const r=had?await sb.from('favorites').delete().match({user_id:me.id,song_id:id}):await sb.from('favorites').insert({user_id:me.id,song_id:id});
 if(r.error){had?favs.add(id):favs.delete(id);render();toast('No se pudo guardar el favorito.')}}
async function newList(){
 const n=$('#pn').value.trim();if(!n)return;
 const{data,error}=await sb.from('playlists').insert({user_id:me.id,name:n}).select('id,name').single();
 if(error)return toast('No se pudo crear la lista.');lists.push(data);render()}
async function openList(id){
 const{data}=await sb.from('playlist_songs').select('song_id,position').eq('playlist_id',id).order('position');
 curList={id,name:lists.find(l=>l.id===id)?.name,items:(data||[]).map(r=>songs.find(s=>s.id===r.song_id)).filter(Boolean)};view='pl';coll=null;render()}
async function rmFromList(id){
 if(!curList)return;
 const{error}=await sb.from('playlist_songs').delete().match({playlist_id:curList.id,song_id:id});
 if(error)return toast('No se pudo quitar de la lista.');
 curList.items=curList.items.filter(s=>s.id!==id);render();toast('Quitada de la lista.')}
async function delList(){
 if(!confirm('¿Eliminar esta lista?'))return;
 const{error}=await sb.from('playlists').delete().eq('id',curList.id);
 if(error)return toast('No se pudo eliminar la lista.');
 lists=lists.filter(l=>l.id!==curList.id);curList=null;render()}
function openPick(id){
 pick=id;const d=$('#dlg'),sg=songs.find(x=>x.id===id);
 d.innerHTML=`<h3>${esc(sg?sg.title:'Opciones')}</h3>${sg?`<p class="mut" style="margin:-6px 0 10px">${esc(artistOf(sg))}</p>`:''}<button class="row" data-o="next">Reproducir a continuación</button><button class="row" data-o="queue">Añadir a la cola</button><button class="row" data-o="share">Compartir</button><p class="mut" style="margin:12px 0 4px;font-weight:700">Añadir a una lista</p>${lists.map(l=>`<button class="row" data-l="${l.id}">${esc(l.name)}</button>`).join('')||'<p class="mut">Crea una lista primero en la pestaña Listas.</p>'}<button class="btn ghost" style="margin-top:12px;width:100%" data-x>Cerrar</button>`;
 d.onclick=async e=>{
  if(e.target.closest('[data-x]'))return d.close();
  const o=e.target.closest('[data-o]');if(o){d.close();return o.dataset.o==='next'?qNext(sg):o.dataset.o==='queue'?qAdd(sg):shareSong(sg)}
  const r=e.target.closest('[data-l]');if(!r)return;
  const{data:last}=await sb.from('playlist_songs').select('position').eq('playlist_id',r.dataset.l).order('position',{ascending:false}).limit(1);
  const pos=last&&last.length?(last[0].position||0)+1:0;
  const{error}=await sb.from('playlist_songs').insert({playlist_id:r.dataset.l,song_id:pick,position:pos});
  d.close();toast(error?'No se pudo añadir (¿ya está en la lista?).':'Añadida a la lista.')};
 d.showModal()}

loadPrefs();boot();
</script>
</body>
</html>
